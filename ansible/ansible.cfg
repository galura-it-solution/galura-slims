[defaults]
inventory = inventories/production
roles_path = roles:../roles
host_key_checking = False
forks = 50
pipelining = True
timeout = 60
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible-cache
retry_files_enabled = False

[ssh_connection]
ssh_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o TCPKeepAlive=yes -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
