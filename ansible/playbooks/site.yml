---
- name: Provision base VPS infrastructure & Security
  hosts: all
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  roles:
    - role: firewall
    - role: docker

- name: Setup Web Server, SLiMS Apps, and Automated SSL Certbot
  hosts: webservers
  become: true
  roles:
    - role: nginx
    - role: app
    - role: certbot
