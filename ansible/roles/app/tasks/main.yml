      DB_USER: "{{ db_user }}"
      DB_PASS: "{{ db_pass_ebook | default(db_pass) }}"
      DB_NAME: "{{ db_name_ebook | default('senayan_ebook') }}"
    memory: "1g"
    security_opts:
      - "no-new-privileges:true"
